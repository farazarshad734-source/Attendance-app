<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Attendance</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #222;
    }

    input {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      border: none;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      color: white;
      font-size: 14px;
      margin: 3px;
    }

    .add {
      background: #007bff;
      width: 100%;
    }

    .present {
      background: #28a745;
    }

    .absent {
      background: #dc3545;
    }

    .reset {
      background: #555;
      width: 100%;
      margin-top: 15px;
    }

    .employee {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .name {
      font-weight: bold;
      margin-right: 10px;
    }

    .counts {
      text-align: center;
      margin: 15px 0;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Employee Attendance</h1>

    <input type="text" id="employeeName" placeholder="Enter Employee Name">
    <button class="add" onclick="addEmployee()">Add Employee</button>

    <div class="counts">
      Present: <b id="presentCount">0</b> |
      Absent: <b id="absentCount">0</b>
    </div>

    <div id="employeeList"></div>

    <button class="reset" onclick="resetAttendance()">Reset Attendance</button>
  </div>

  <script>
    let employees = [];

    function addEmployee() {
      const input = document.getElementById("employeeName");
      const name = input.value.trim();

      if (name === "") {
        alert("Please enter employee name");
        return;
      }

      employees.push({
        name: name,
        status: ""
      });

      input.value = "";
      displayEmployees();
    }

    function markAttendance(index, status) {
      employees[index].status = status;
      displayEmployees();
    }

    function displayEmployees() {
      const list = document.getElementById("employeeList");
      list.innerHTML = "";

      employees.forEach((employee, index) => {
        const div = document.createElement("div");
        div.className = "employee";

        div.innerHTML = `
          <span class="name">${employee.name}</span>

          <div>
            <button class="present" onclick="markAttendance(${index}, 'Present')">
              Present
            </button>

            <button class="absent" onclick="markAttendance(${index}, 'Absent')">
              Absent
            </button>
          </div>

          <span>
            ${employee.status}
          </span>
        `;

        list.appendChild(div);
      });

      updateCounts();
    }

    function updateCounts() {
      let present = 0;
      let absent = 0;

      employees.forEach(employee => {
        if (employee.status === "Present") present++;
        if (employee.status === "Absent") absent++;
      });

      document.getElementById("presentCount").textContent = present;
      document.getElementById("absentCount").textContent = absent;
    }

    function resetAttendance() {
      employees.forEach(employee => {
        employee.status = "";
      });

      displayEmployees();
    }
  </script>

</body>
</html>
